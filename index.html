<style>/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {

.modal .hd h3{margin:0;flex:1;color:var(--wine2)}
.x{border:0;background:#0001;border-radius:50%;width:32px;height:32px;cursor:pointer;font-size:16px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;z-index:400;font-size:13px;display:none;max-width:90vw;text-align:center}
table.t{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;font-size:13.5px}
table.t th{background:var(--wine);color:#fff;padding:7px 8px;text-align:center}
table.t td{padding:7px 8px;border-bottom:1px solid #f1e5d2;vertical-align:middle}
table.t td.ka{font-size:15px;direction:ltr;text-align:center}
table.t td.la{direction:ltr;text-align:center;color:var(--wine2);font-weight:600}
.dt{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--bd);background:#fff;border-radius:16px;padding:2px 4px 2px 8px}
.dt input[type=text]{border:0;outline:0;width:94px;text-align:center;direction:ltr;background:transparent;padding:5px 2px}
.dt input[type=date]{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
.dt button{border:0;background:transparent;cursor:pointer;font-size:16px}
.dt{position:relative}
.day{border:2px solid var(--bd);border-radius:16px;background:#fff;margin:10px 0;overflow:hidden}
.day>.dh{padding:8px 12px;color:#fff;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.stop{display:flex;gap:8px;padding:8px 10px;border-top:1px solid #f1e5d2;align-items:flex-start}
.stop .tm{flex:none;width:52px;text-align:center;font-weight:800;color:var(--wine2);direction:ltr}
.stop .nm{flex:1}
.stop small{color:var(--mut)}
.leg{padding:3px 10px 3px 10px;background:#f7f3ec;font-size:12px;color:var(--mut);display:flex;gap:6px;align-items:center;border-top:1px dashed var(--bd)}
.leg select{border:1px solid var(--bd);border-radius:10px;padding:2px 6px;font-size:12px;background:#fff}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;margin:6px 0}
.legend i{display:inline-block;width:26px;height:6px;border-radius:3px;margin-inline-end:5px;vertical-align:middle}
svg text{font-family:inherit}
.metrowrap{position:relative;background:#fff;border:2px solid var(--bd);border-radius:14px;overflow:auto}
.metrowrap.full{position:fixed;inset:0;z-index:200;border-radius:0}
.metrowrap svg{display:block;min-width:820px;width:100%;height:auto}
.st{cursor:pointer}
.st:hover circle,.st.on circle{fill:var(--gold);stroke:#000}
.lbl{display:flex;gap:6px;flex-wrap:wrap;font-size:12px}
.hero{background:linear-gradient(135deg,var(--wine2),var(--wine) 60%,#d1495b);color:#fff;border-radius:16px;padding:12px 14px;margin-bottom:10px}
.hero h1{margin:0 0 4px;font-size:20px}.hero p{margin:0;font-size:13px;opacity:.95}
.big-btns{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:8px 0}
.big-btns .btn{justify-content:center;padding:10px}
footer{text-align:center;font-size:12px;color:var(--mut);padding:14px}
footer b{color:var(--gold2)}
.ov{position:fixed;inset:0;z-index:999;background:linear-gradient(135deg,var(--wine2),var(--wine));color:#fff;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:18px}
.ov.on{display:flex}
@media (min-width:760px){.modal{align-items:center}.modal .sheet{border-radius:20px}}

function applyWikiCoords(){
  PLACES.forEach(p=>{
    if(!p.wiki)return;
    for(const t of p.wiki){const w=photoCache[t];if(w&&w.lat!=null&&p.lat!=null&&dist(p.lat,p.lng,w.lat,w.lng)<3){p.lat=w.lat;p.lng=w.lng;if(p.ref){p.ref.lat=w.lat;p.ref.lng=w.lng}break}}
  });
}
function dist(a,b,c,d){const R=6371,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b);const x=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

async function wikiInfo(titles){
  for(const t of titles||[]){
    if(photoCache[t]&&(photoCache[t].thumb||photoCache[t].lat!=null))return photoCache[t];
    try{
      const r=await fetch('https://en.wikipedia.org/api/rest_v1/page/summary/'+enc(t.replace(/ /g,'_')),{headers:{'Accept':'application/json'}});
      if(!r.ok)continue;const j=await r.json();
      const o={thumb:j.thumbnail?j.thumbnail.source:null,lat:j.coordinates?j.coordinates.lat:null,lng:j.coordinates?j.coordinates.lon:null,page:j.content_urls?j.content_urls.desktop.page:null};
      if(o.thumb||o.lat!=null){photoCache[t]=o;LS.set('photos',photoCache);return o}
    }catch(e){}
  }
  return null;
}
let phQ=[],phRun=0;
function hydratePhotos(root){
  $$('.ph[data-wiki]:not([data-done])',root).forEach(el=>{el.dataset.done='1';phQ.push(el)});
  while(phRun<4&&phQ.length){phRun++;const el=phQ.shift();
    wikiInfo(el.dataset.wiki.split('|')).then(o=>{if(o&&o.thumb&&el.isConnected){el.style.backgroundImage='url("'+o.thumb+'")';el.querySelector('.ph-ic')&&(el.querySelector('.ph-ic').style.display='none')}if(o)applyWikiCoords()}).finally(()=>{phRun--;hydratePhotos(document)});
  }
}

function metroGraph(){
  const g={};const add=(a,b)=>{(g[a]=g[a]||[]).push(b);(g[b]=g[b]||[]).push(a)};
  Object.entries(METRO.lines).forEach(([lk,l])=>{for(let i=0;i<l.stations.length-1;i++)add(l.stations[i],l.stations[i+1])});
  add('station1','station2');return g;
}
function lineOf(id){return Object.keys(METRO.lines).find(k=>METRO.lines[k].stations.includes(id))}
function metroPath(a,b){
  if(a===b)return[a];const g=metroGraph(),prev={[a]:null},q=[a];
  while(q.length){const c=q.shift();if(c===b)break;(g[c]||[]).forEach(n=>{if(!(n in prev)){prev[n]=c;q.push(n)}})}
  if(!(b in prev))return null;const p=[];for(let c=b;c;c=prev[c])p.unshift(c);return p;
}
function metroGuide(a,b){

    const lk=lineOf(x),st=METRO.lines[lk].stations,ix=st.indexOf(x),iy=st.indexOf(y);

const DCOL=['#8e1b34','#1c4e80','#2a9d3a','#e07b00','#6b3a1f','#5b3f8c','#d62828','#0a8f8f','#b5651d','#3b5bdb'];
const CENTER=[41.6934,44.8012];
const INTERESTS=[['history','היסטוריה'],['religion','כנסיות ודת'],['view','תצפיות'],['walk','טיולים ברגל'],['family','משפחה וילדים'],['museum','מוזיאונים'],['culture','תרבות'],['market','שווקים'],['nature','טבע'],['food','אוכל ויין'],['shopping','קניות']];
const MODES=[['foot','🚶 ברגל'],['metro','🚇 מטרו'],['bus','🚌 אוטובוס/מרשרוטקה'],['taxi','🚕 מונית'],['car','🚗 רכב שכור']];
const METROPTS=Object.entries(METRO.st).filter(([i,s])=>s.lat!=null&&i!=='station2').map(([i,s])=>[i,s.lat,s.lng]);
const pt=k=>{const p=placeByKey(k);return p&&p.lat!=null?[p.lat,p.lng]:null};
const dKm=(a,b)=>a&&b?dist(a[0],a[1],b[0],b[1]):0;
function nearMetro(p){let b=null,bd=99;METROPTS.forEach(m=>{const d=dist(p[0],p[1],m[1],m[2]);if(d<bd){bd=d;b=m[0]}});return[b,bd]}
function autoMode(a,b){if(!a||!b)return'taxi';const d=dKm(a,b);if(d<1.3)return'foot';const[m1,d1]=nearMetro(a),[m2,d2]=nearMetro(b);if(m1!==m2&&d1<.9&&d2<.9)return'metro';return'taxi'}
function legMin(mode,d){const m=mode==='foot'?d*1.3/4.5*60:mode==='metro'?12+d*1.2/25*60:mode==='bus'?10+d*1.15/32*60:(mode==='car'?5:6)+d*1.2/(d>10?55:22)*60;return Math.max(3,Math.round(m))}
const toMin=t=>{const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');return m?+m[1]*60+ +m[2]:570};
const fmtT=m=>{m=Math.round(m);return pad(Math.floor(m/60)%24)+':'+pad(m%60)};
function stopDur(k){const p=placeByKey(k);if(!p)return 45;const c=k[0];if(c==='s'||c==='t')return (p.ref&&p.ref.dur)||60;return c==='r'?60:c==='p'?90:c==='k'?60:c==='h'?20:15}
const curRoute=()=>state.routes.find(r=>r.id===state.cur)||null;

const homeOf=r=>{const p=r.hotel?pt('h:'+r.hotel):null;return p||CENTER};

  const home=homeOf(r);
  r.days.forEach(d=>{
    let cur=toMin(d.start||'09:30'),prev=home;
    d.stops.forEach(s=>{
      const p=pt(s.k);
      if(!s.mm)s.mode=autoMode(prev,p);
      s.km=prev&&p?dKm(prev,p):0;s.leg=prev&&p?legMin(s.mode,s.km):10;
      cur+=s.leg;s.t=fmtT(cur);cur+=(s.dur||stopDur(s.k));s.e=fmtT(cur);
      if(p)prev=p;
    });
    const last=d.stops[d.stops.length-1];
    d.back=last&&prev?{m:last.mode,min:legMin(last.mode==='foot'&&dKm(prev,home)>2?'taxi':last.mode,dKm(prev,home))}:null;
    d.end=fmtT(cur);
  });
}
function genRoute(o){
  const hot=o.hotel?placeByKey('h:'+o.hotel):null,home=hot&&hot.lat!=null?[hot.lat,hot.lng]:CENTER;
  const weak=o.kids>0||o.seniors>0;
  const budget={relaxed:300,normal:420,intense:540}[o.pace]||420;
  const used=new Set(),usedR=new Set(),days=[];
  const trips=(o.trips&&o.days>=3?TRIPS.filter(t=>passHF('t:'+t.id)):[]).slice();
  const tripDays=o.days>=7?[3,6]:o.days>=3?[3]:[];
  const score=(s,from)=>(40-s.rank*1.2)+(o.interests.includes(s.cat)?22:0)+(o.kids>0&&s.kids?12:0)+(weak&&s.walk==='high'?-30:weak&&s.walk==='med'?-8:0)+(o.interests.includes('food')&&s.cat==='market'?8:0)-dist(from[0],from[1],s.lat,s.lng)*3;
  const nearRest=(from,pr)=>{let b=null,bs=-1e9;RESTAURANTS.forEach(r=>{if(usedR.has(r.id)||!passHF('r:'+r.id))return;const sc=(r.pick?3:0)-(r.lat!=null?dist(from[0],from[1],r.lat,r.lng)*2:1.5)-(pr&&r.price>pr?5:0);if(sc>bs){bs=sc;b=r}});if(b)usedR.add(b.id);return b};
  for(let i=0;i<o.days;i++){
    const iso=o.start?addDays(o.start,i):null,dow=iso?dowOf(iso):null;
    const stops=[];
    if(tripDays.includes(i+1)&&trips.length){
      const t=trips.shift();stops.push({k:'t:'+t.id,dur:t.dur,mode:'bus',mm:true});
    }else{
      let pool=SITES.filter(s=>s.lat!=null&&!used.has(s.id)&&passHF('s:'+s.id)&&(dow==null||!(s.closed||[]).includes(dow))&&!(o.walk==='low'&&s.walk==='high'));
      let cur=home,time=0;
      while(pool.length){
        pool.forEach(s=>s._sc=score(s,cur));pool.sort((a,b)=>b._sc-a._sc);
        const s=pool[0],d=dKm(cur,[s.lat,s.lng]),lg=legMin(autoMode(cur,[s.lat,s.lng]),d);
        if(stops.length>=2&&time+lg+s.dur>budget)break;
        if(stops.length>=1&&time+lg+s.dur>budget+90)break;
        stops.push({k:'s:'+s.id,dur:s.dur});used.add(s.id);time+=lg+s.dur;cur=[s.lat,s.lng];pool.shift();
        if(stops.length>=5)break;
      }
      if(stops.length>=2){const mid=Math.ceil(stops.length/2),p=pt(stops[mid-1].k)||home,r=nearRest(p,2);if(r)stops.splice(mid,0,{k:'r:'+r.id,dur:60})}
      if(o.interests.includes('shopping')&&i===(o.days>1?1:0)){const last=pt(stops[stops.length-1]?stops[stops.length-1].k:'')||home;let b=null,bd=1e9;SHOPPING.forEach(s=>{if(s.lat==null)return;const d=dist(last[0],last[1],s.lat,s.lng);if(d<bd){bd=d;b=s}});if(b)stops.push({k:'p:'+b.id,dur:90})}
      if(o.interests.includes('food')&&stops.length){const r=nearRest(pt(stops[stops.length-1].k)||home,0);if(r)stops.push({k:'r:'+r.id,dur:90})}
    }
    days.push({start:'09:30',stops});
  }
  return {id:'r'+Date.now().toString(36),name:o.name||('טיול בטביליסי — '+o.days+' ימים'),start:o.start||null,hotel:o.hotel||'',days,docs:[],who:{adults:o.adults,kids:o.kids,seniors:o.seniors},interests:o.interests};
}

function dayHTML(r,i){

/* ===== מה עושים היום ===== */
function todayItems(iso){
  const dow=dowOf(iso),w=wxFor(iso);
  const rain=w&&((w.rain||0)>=50||(w.code>=51&&w.code<=99)),cold=w&&w.max<=6,hot=w&&w.max>=30,clear=w&&w.code<=2&&(w.rain||0)<30,wkd=dow===0||dow===6;
  const why=[];if(rain)why.push('יום גשום — עדיפים מקומות מקורים');else if(clear)why.push('מזג אוויר בהיר — מצוין לתצפיות ולהליכה');if(cold)why.push('קר — תתלבשו חם ועדיפו מקומות מקורים');if(hot)why.push('חם — שתו הרבה והעדיפו מקומות מקוררים בצהריים');if(wkd)why.push('סוף שבוע — בשווקים ובאתרים הפופולריים יש יותר אנשים');
  const items=SITES.filter(s=>passHF('s:'+s.id)&&!(s.closed||[]).includes(dow)).map(s=>{
    const t=s.tags||[],out=t.includes('outdoor')&&!t.includes('indoor')&&!t.includes('rain-ok');let sc=40-s.rank*1.2,tg=[];
    if(rain){if(t.includes('indoor')||t.includes('rain-ok')||s.cat==='museum'){sc+=22;tg.push('מתאים לגשם')}if(out)sc-=28}
    if(clear&&(t.includes('clear')||t.includes('view')||t.includes('sunset'))){sc+=16;tg.push('מומלץ בבהיר')}
    if(cold){if(t.includes('cold-ok')||t.includes('indoor')){sc+=10;tg.push('מתאים לקור')}if(out)sc-=10}
    if(hot&&t.includes('indoor')){sc+=8;tg.push('מקורה')}
    if(wkd&&t.includes('weekend')){sc+=14;tg.push('חי בסוף שבוע')}
    if(t.includes('evening'))tg.push('נעים בערב');
    if(s.free&&/חינם/.test(s.free))tg.push('חינם');
    return {s,sc,tg}
  }).sort((a,b)=>b.sc-a.sc);
  return {items,why,w};
}

  const evs=EVENTS.filter(e=>e.date===iso);
  if(evs.length)h+='<h3 style="color:var(--wine2)">🎭 אירועים היום</h3>'+evs.map(e=>'<div class="panel"><b>'+esc(e.he)+'</b><div class="names" style="direction:rtl">'+esc(e.venue)+' · '+esc(e.price)+'</div><a class="btn" target="_blank" rel="noopener" href="'+esc(e.src)+'">🎟️ כרטיסים</a></div>').join('');
  const rs=RESTAURANTS.filter(r=>r.pick&&passHF('r:'+r.id)).slice(0,3);
  if(rs.length)h+='<h3 style="color:var(--wine2)">🍽️ לארוחה</h3>'+rs.map(r=>'<div class="panel" style="display:flex;gap:8px;align-items:center"><div style="flex:1"><b>'+esc(r.he)+'</b><div class="names" style="direction:rtl">'+esc(r.cuisine)+' · '+esc(r.pm)+'</div></div><button class="btn pri" data-act="showmap" data-k="r:'+r.id+'">📍</button></div>').join('');
  return h;
}

const AREA_TAG={old:'old',center:'center',station:'metro'};
VIEWS.areas={html(){return '<h2 class="sec">אזורי לינה — איפה כדאי לישון</h2><div class="note">הבחירה תלויה בסגנון הטיול. קרבה למטרו חוסכת זמן ועליות. לחצו על "מלונות באזור" כדי לראות הצעות.</div><div id="list" class="grid"></div>'},
  list(){$('#list').innerHTML=AREAS.map(a=>'<article class="card"><div class="cb"><h3>🛏️ '+esc(a.he)+'</h3><p>✅ '+esc(a.pros)+'</p><p>⚠️ '+esc(a.cons)+'</p>'+kvList([['מטרו קרוב',esc(a.metro)],['מתאים ל',esc(a.who)]])+'</div><div class="acts">'+(AREA_TAG[a.id]?'<button class="btn pri" data-act="areahot" data-t="'+AREA_TAG[a.id]+'">🏨 מלונות באזור</button>':'')+'<a class="btn" target="_blank" rel="noopener" href="'+gmapsSearch(a.he)+'">📍 במפה</a></div></article>').join('')}};
const EVT=[['concert','קונצרטים'],['sport','ספורט'],['theatre','תיאטרון ואופרה'],['festival','פסטיבלים']];
VIEWS.events={html(){
  const from=state.evFrom||todayIso();
  return '<h2 class="sec">אירועי תרבות, קונצרטים וספורט</h2><div class="bar"><label>מתאריך '+dateField('ev-d',from)+'</label>'+selBox('events','type','כל הסוגים',EVT)+'</div><div class="note">הרשימה כוללת אירועים שאומתו בעת בניית האפליקציה ואינה מלאה. לרשימה עדכנית לחצו על אתרי הכרטיסים למטה או על כפתור הרענון.</div><div id="list" class="grid"></div><h2 class="sec" style="margin-top:14px">איפה קונים כרטיסים</h2><div class="grid">'+TICKET_SITES.map(t=>'<a class="card" target="_blank" rel="noopener" href="'+esc(t.url)+'" style="text-decoration:none;color:inherit"><div class="cb"><b>🎟️ '+esc(t.he)+'</b><div class="names">'+esc(t.url.replace(/^https?:\/\//,''))+'</div></div></a>').join('')+'</div>'},
  list(){const f=F('events'),from=state.evFrom||todayIso();
    const l=EVENTS.filter(e=>e.date>=from&&(!f.type||e.type===f.type)).sort((a,b)=>a.date<b.date?-1:1);
    $('#list').innerHTML=l.map(e=>'<article class="card"><div class="cb"><h3>🎭 '+esc(e.he)+'</h3><div class="meta"><span class="tag b">'+DAYS[dowOf(e.date)]+' '+fmtD(e.date)+'</span><span class="tag">'+esc(e.price)+'</span></div><p>📍 '+esc(e.venue)+'</p></div><div class="acts"><a class="btn gold" target="_blank" rel="noopener" href="'+esc(e.src)+'">🎟️ כרטיסים</a><a class="btn" target="_blank" rel="noopener" href="'+gmapsSearch(e.venue)+'">📍 המקום</a></div></article>').join('')||'<div class="note">אין אירועים ברשימה מהתאריך שנבחר.</div>'}};

/* ===== ניהול מסכים ואירועים ===== */
function buildTabs(){$('#tabs').innerHTML=TABS.map(t=>'<button data-t="'+t[0]+'">'+t[1]+'</button>').join('')}
function setTab(t){
  state.tab=t;$$('#tabs button').forEach(b=>{const on=b.dataset.t===t;b.classList.toggle('on',on);if(on)b.scrollIntoView({inline:'center',block:'nearest'})});
  render();window.scrollTo(0,0);
}
function render(){const v=VIEWS[state.tab];$('#main').innerHTML=v.html();v.list&&v.list();v.after&&v.after();bindDates($('#main'));hydratePhotos($('#main'))}
function relist(){const v=VIEWS[state.tab];v&&v.list&&v.list()}
async function refreshAll(){
  toast('מרענן…');Object.keys(photoCache).forEach(k=>delete photoCache[k]);LS.set('photos',{});
  await loadWeather(true);
  try{if(navigator.serviceWorker){const reg=await navigator.serviceWorker.getRegistration();if(reg)await reg.update()}}catch(e){}
  render();toast('רוענן: מזג האוויר, התמונות וגרסת האפליקציה');
}
function toggleFull(id,btn){
  const el=document.getElementById(id);if(!el)return;const on=el.classList.toggle('full');
  if(btn&&btn.textContent)btn.textContent=on?'✕ יציאה ממסך מלא':'⛶ מסך מלא';
  const x=$('#mmx');if(x&&id==='mm')x.style.display=on?'block':'none';
  setTimeout(()=>{try{LMAP&&LMAP.invalidateSize();RMAP&&RMAP.invalidateSize()}catch(e){}},150);
}
document.addEventListener('click',e=>{
  const st=e.target.closest('.st');
  if(st&&st.dataset.st){const id=st.dataset.st;$$('.st.on').forEach(x=>x.classList.remove('on'));st.classList.add('on');$('#stinfo').innerHTML=stationPanel(id);hydratePhotos($('#stinfo'));$('#stinfo').scrollIntoView({behavior:'smooth',block:'nearest'});return}
  const tb=e.target.closest('#tabs button');if(tb){setTab(tb.dataset.t);return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,d=el.dataset,r=curRoute();
  switch(a){
    case 'today':openToday();break;
    case 'refresh':refreshAll();break;
    case 'close':closeModal();break;
    case 'cal':{const c=document.getElementById(d.for+'__c');if(c){const iso=getDate(d.for);if(iso)c.value=iso;try{c.showPicker?c.showPicker():c.click()}catch(_){c.click()}}break}
    case 'full':toggleFull(d.t,el);break;
    case 'locate':if(!navigator.geolocation){toast('המיקום אינו זמין במכשיר');break}navigator.geolocation.getCurrentPosition(p=>{userPos=[p.coords.latitude,p.coords.longitude];if(LMAP){L.circleMarker(userPos,{radius:8,color:'#fff',fillColor:'#2b6cb0',fillOpacity:1,weight:3}).addTo(LMAP).bindPopup('אתם כאן');LMAP.flyTo(userPos,16)}},()=>toast('לא ניתן לקבל מיקום. אפשרו גישה למיקום בהגדרות.'),{enableHighAccuracy:true,timeout:10000});break;
    case 'pick':pickPlace('🔎 בחר מקום במפה',k=>selectPlace(k));break;
    case 'ppcat':pickPlace.cat=d.c;$$('#pp-cats .chip').forEach(c=>c.classList.toggle('on',c.dataset.c===d.c));if($('#pp-q'))$('#pp-q').value='';ppRender();break;
    case 'pppick':{const cb=pickPlace.cb;closeModal();cb&&cb(d.k);break}
    case 'showmap':selectPlace(d.k);break;
    case 'mmode':mapMode=d.m;selectPlace(selKey,true);break;
    case 'routeme':routeFromMe();break;
    case 'routefrom':{const p=placeByKey(selKey);pickPlace('מאיפה יוצאים?',k=>{const f=placeByKey(k);if(f&&f.lat!=null&&p)drawRoute([f.lat,f.lng],[p.lat,p.lng],'מ'+f.name)},true);break}
    case 'clearroute':clearRoute();break;
    case 'fav':if(isFav(d.k))delete state.fav[d.k];else state.fav[d.k]=1;LS.set('fav',state.fav);relist();break;
    case 'hide':if(isHidden(d.k))delete state.hide[d.k];else state.hide[d.k]=1;LS.set('hide',state.hide);relist();break;
    case 'favonly':state.favOnly=!state.favOnly;render();break;
    case 'showhidden':state.showHidden=!state.showHidden;render();break;
    case 'ftog':{const[t,k]=d.f.split(':');F(t)[k]=!F(t)[k];render();break}
    case 'mguide':$('#mg-out').innerHTML=metroGuide($('#mg-a').value,$('#mg-b').value);break;
    case 'say':say(+d.i);break;
    case 'areahot':F('hotels').tag=d.t;setTab('hotels');break;
    case 'rt-new':state.rtForm=true;render();break;
    case 'rt-cancel':state.rtForm=false;render();break;
    case 'rt-gen':{const o=readForm();if(!o.start){toast('בחרו תאריך הגעה תקין (DD/MM/YYYY)');break}const n=genRoute(o);state.routes.push(n);state.cur=n.id;state.rtForm=false;state.rday='all';saveRoutes();render();toast('המסלול נבנה — אפשר לערוך אותו');break}
    case 'rt-open':state.cur=d.id;state.rtForm=false;state.rday='all';render();break;
    case 'rt-daymap':state.rday=d.d;render();if(d.d!=='all'){const e2=document.getElementById('rw');e2&&e2.scrollIntoView({behavior:'smooth',block:'start'})}break;
    case 'rt-add':pickPlace('➕ הוספת מקום ליום '+(+d.d+1),k=>{r.days[+d.d].stops.push({k,dur:stopDur(k)});rtSave(true)});break;
    case 'rt-rm':r.days[+d.d].stops.splice(+d.s,1);rtSave(true);break;
    case 'rt-up':{const s=r.days[+d.d].stops,i=+d.s;if(i>0){[s[i-1],s[i]]=[s[i],s[i-1]];rtSave(true)}break}
    case 'rt-dn':{const s=r.days[+d.d].stops,i=+d.s;if(i<s.length-1){[s[i+1],s[i]]=[s[i],s[i+1]];rtSave(true)}break}
    case 'rt-save':saveRoutes();toast('המסלול נשמר');break;
    case 'rt-del':if(confirm('למחוק את המסלול "'+r.name+'"?')){state.routes=state.routes.filter(x=>x.id!==r.id);state.cur=state.routes[0]?state.routes[0].id:null;saveRoutes();render()}break;
    case 'rt-share':{const t=routeText(r),u=routeLink(r);if(navigator.share){navigator.share({title:r.name,text:t,url:location.protocol==='file:'?undefined:u}).catch(()=>{})}else{copyText(t+'\n\n'+u).then(ok=>toast(ok?'המסלול הועתק — הדביקו בהודעה':'לא ניתן להעתיק'))}break}
    case 'rt-copy':copyText(routeLink(r)).then(ok=>toast(ok?'הקישור הועתק (גם הקוד של המסלול כלול בו)':'לא ניתן להעתיק'));break;
    case 'rt-export':saveFileDialog((r.name||'route').replace(/[\\/:*?"<>|]/g,'_')+'.json',JSON.stringify({tbilisiRoute:1,name:r.name,start:r.start,hotel:r.hotel,days:r.days.map(x=>({start:x.start,stops:x.stops.map(s=>({k:s.k,dur:s.dur,mm:s.mm?1:0,mode:s.mm?s.mode:undefined}))})),docs:r.docs||[]},null,1)).then(ok=>ok&&toast('המסלול נשמר לקובץ'));break;
    case 'rt-import':importModal();break;
    case 'rt-impgo':{const v=$('#imp-t').value.trim();let n=decRoute(v);if(!n){try{const o=JSON.parse(v);n=decRoute(btoa(unescape(encodeURIComponent(JSON.stringify(o)))))}catch(_){}}if(!n){toast('לא זוהה מסלול תקין');break}addImported(n);break}
    case 'rt-doc':{let u=$('#dc-u').value.trim();const t=$('#dc-t').value.trim(),de=$('#dc-d').value.trim();if(!t&&!u){toast('כתבו שם או קישור');break}if(u&&!/^https?:\/\//i.test(u)){if(/^[a-z]+:/i.test(u)){toast('הקישור צריך להתחיל ב-http או https');break}u='https://'+u}(r.docs=r.docs||[]).push({title:t,url:u,desc:de});rtSave(true);break}
    case 'rt-docrm':r.docs.splice(+d.i,1);rtSave(true);break;
    case 'install':if(window._dip){window._dip.prompt();window._dip=null;el.style.display='none'}break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target,r=curRoute();
  if(t.matches('[data-f]')){const[tab,k]=t.dataset.f.split(':');F(tab)[k]=t.value;relist();return}
  if(t.id==='td-d__c'||t.id==='td-d'){const iso=getDate('td-d');if(iso)openToday(iso);return}
  if(t.id==='ev-d__c'||t.id==='ev-d'){const iso=getDate('ev-d');if(iso){state.evFrom=iso;relist()}return}
  if(t.id==='rt-d0__c'||t.id==='rt-d0'){if(r&&!state.rtForm){const iso=getDate('rt-d0');if(iso){r.start=iso;rtSave(true)}}return}
  if(t.dataset.int!==undefined){t.parentElement.classList.toggle('on',t.checked);return}
  if(!r)return;const d=t.dataset;
  if(d.rt==='mode'){const s=r.days[+d.d].stops[+d.s];s.mode=t.value;s.mm=true;rtSave(true)}
  else if(d.rt==='name'){r.name=t.value.trim()||r.name;saveRoutes()}
  else if(d.rt==='hotel'){r.hotel=t.value;rtSave(true)}
  else if(d.rt==='dstart'){const m=/^(\d{1,2}):?(\d{2})$/.exec(t.value.trim());r.days[+d.d].start=m?pad(+m[1])+':'+m[2]:'09:30';rtSave(true)}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-f]')&&t.type==='search'){const[tab,k]=t.dataset.f.split(':');F(tab)[k]=t.value;relist();return}
  if(t.dataset&&t.dataset.rt==='dstart'){let v=t.value.replace(/\D/g,'').slice(0,4);t.value=v.length>2?v.slice(0,2)+':'+v.slice(2):v}
  if(t.id==='td-d'&&t.value.length===10)t.dispatchEvent(new Event('change',{bubbles:true}));
  if(t.id==='ev-d'&&t.value.length===10)t.dispatchEvent(new Event('change',{bubbles:true}));
  if(t.id==='rt-d0'&&t.value.length===10&&curRoute()&&!state.rtForm)t.dispatchEvent(new Event('change',{bubbles:true}));
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const f=$('.full');if(f){const b=$('[data-act=full][data-t='+f.id+']');toggleFull(f.id,b)}else closeModal()}if(e.key==='Enter'&&e.target.closest&&e.target.closest('.st'))e.target.closest('.st').dispatchEvent(new MouseEvent('click',{bubbles:true}))});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ===== עותק יחיד ===== */
function singleInstance(){
  const ov=$('#ov');
  try{
    const bc=new BroadcastChannel('tbilisi-guide');
    bc.onmessage=m=>{if(m.data==='focus'){try{window.focus()}catch(e){}toast('האפליקציה כבר פתוחה כאן')}};
    if(navigator.locks){navigator.locks.request('tbilisi-guide-single',{ifAvailable:true},lock=>{
      if(!lock){bc.postMessage('focus');ov.innerHTML='<div><div style="font-size:44px">🏛️</div><b>האפליקציה כבר פתוחה</b><br>עוברים לעותק שנפתח קודם.<br><small>אפשר לסגור את החלון הזה.</small></div>';ov.classList.add('on');setTimeout(()=>{try{window.close()}catch(e){}},700);return}
      return new Promise(()=>{});
    })}
  }catch(e){}
}

/* ===== הפעלה ===== */
(function init(){
  singleInstance();
  buildTabs();renderWx();loadWeather();setInterval(()=>loadWeather(),30*60*1000);
  setTab('map');
  const m=/[#&]r=([^&]+)/.exec(location.hash);
  if(m){const n=decRoute(m[1]);if(n&&confirm('התקבל מסלול "'+n.name+'". לשמור אותו באפליקציה?'))addImported(n);history.replaceState(null,'',location.href.split('#')[0])}
  window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._dip=e;const b=$('#inst');if(b)b.style.display='inline-flex'});
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
  state.rday='all';state.cur=state.routes[0]?state.routes[0].id:null;
})();
</script></body></html>
